name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gate:
    # The suite never talks to Flow and never spends credits, so it runs anywhere. Everything that does touch
    # the account lives in scripts/acceptance/ and is run by hand, on purpose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
