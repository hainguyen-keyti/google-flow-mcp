name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gate:
    # The suite never talks to Flow and never spends credits, so it runs anywhere. Everything that does touch
    # the account lives in scripts/acceptance/ and is run by hand, on purpose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        # 25 tests render and measure real video; they are not mocks, and that is deliberate.
        # fonts-dejavu-core is one of the candidates src/video/post.py knows about; VIDEO_FONT can name
        # another one instead.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
