[project]
name = "video"
version = "0.1.0"
description = "Agent-driven Google Flow (flow.google.com) orchestration with ffmpeg post-production"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hainguyen-keyti" }]
keywords = ["google-flow", "veo", "mcp", "video-generation", "agent"]
# 3.12: rglob(case_sensitive=False), which every paid tool's ledger sweep uses (review 2026-10-08, D25).
requires-python = ">=3.12"
dependencies = [
    "gflow-cli==0.78.0",
    "mcp==2.2.0",
]

[project.urls]
Homepage = "https://github.com/hainguyen-keyti/google-flow-mcp"
Issues = "https://github.com/hainguyen-keyti/google-flow-mcp/issues"

[project.scripts]
video = "video.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video"]
# Research probes stay on the repo; one of them clicks Start generation with no ledger row (review 2026-10-08).
exclude = ["src/video/probes"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
