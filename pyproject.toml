[project]
name = "video"
version = "0.1.0"
description = "Agent-driven Google Flow (flow.google.com) orchestration with ffmpeg post-production"
requires-python = ">=3.11"
dependencies = [
    "gflow-cli==0.78.0",
    "mcp==2.2.0",
]

[project.scripts]
video = "video.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
